sonar.projectKey=solarssk_wp-critical-css
sonar.organization=recmedia

sonar.exclusions=**/node_modules/**,**/vendor/**,wordpress-plugin/wp-critical-css-tests/tests/php/wordpress-core/**,**/*.min.js

# Without this, SonarCloud falls back to a path heuristic to guess which
# files are tests (confirmed directly in a scan's own log: "Test files were
# detected using a path heuristic because sonar.tests is not set") - JS test
# files matched the *.test.js convention fine on their own, but the PHP test
# suite (no filename convention SonarCloud's PHP analyzer recognizes
# out of the box) got misclassified as regular new source code. Test code
# isn't itself subject to the new-code coverage requirement (nothing
# "covers" a test), so those files being wrongly counted as uncovered
# production code was dragging new_coverage to 0% and failing the Quality
# Gate outright, even with real coverage reports correctly imported for
# both languages (see sonar.javascript.lcov.reportPaths/
# sonar.php.coverage.reportPaths below).
sonar.test.inclusions=**/*.test.js,wordpress-plugin/wp-critical-css-tests/tests/php/**/*.php

# Populated by ci.yml's build-test/phpunit jobs, downloaded into the
# sonarcloud-scan job (needs: [build-test, phpunit]) before this scan runs -
# without these, every line in service/ and wordpress-plugin/wp-critical-css/
# reports as uncovered regardless of the real test suites both actually have.
sonar.javascript.lcov.reportPaths=service/lcov.info
sonar.php.coverage.reportPaths=wordpress-plugin/wp-critical-css-tests/coverage.xml

# php:S105 (tab indentation) can't be fixed in code here - WordPress Coding
# Standards mandate tabs for PHP, which is exactly what this rule flags, and
# every .php file under wordpress-plugin/ (both the shipped plugin and its
# test suite) uses them consistently for that reason. An inline `// NOSONAR
# php:S105` comment does NOT suppress this - confirmed directly against
# SonarCloud's own issue-search API: this rule reports with no anchor line
# (line: null) for every one of its findings in this project, and NOSONAR is
# a per-line suppression mechanism that has nothing to attach to when there's
# no line. This project ran under SonarCloud's Automatic Analysis mode before
# this file existed, which has no config surface for issue exclusions at all
# - CI-based analysis (this file, wired into .github/workflows/ci.yml) is the
# only way to actually exclude this rule for this codebase's PHP files.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S105
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.php
