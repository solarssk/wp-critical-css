sonar.projectKey=solarssk_wp-critical-css
sonar.organization=recmedia

sonar.exclusions=**/node_modules/**,**/vendor/**,wordpress-plugin/wp-critical-css-tests/tests/php/wordpress-core/**,**/*.min.js

# Without this, SonarCloud falls back to a path heuristic to guess which
# files are tests (confirmed directly in a scan's own log: "Test files were
# detected using a path heuristic because sonar.tests is not set") - JS test
# files matched the *.test.js convention fine on their own, but the PHP test
# suite (no filename convention SonarCloud's PHP analyzer recognizes
# out of the box) got misclassified as regular new source code. Test code
# isn't itself subject to the new-code coverage requirement (nothing
# "covers" a test), so those files being wrongly counted as uncovered
# production code was dragging new_coverage to 0% and failing the Quality
# Gate outright, even with real coverage reports correctly imported for
# both languages (see sonar.javascript.lcov.reportPaths/
# sonar.php.coverage.reportPaths below).
sonar.test.inclusions=**/*.test.js,wordpress-plugin/wp-critical-css-tests/tests/php/**/*.php

# Populated by ci.yml's build-test/phpunit jobs, downloaded into the
# sonarcloud-scan job (needs: [build-test, phpunit]) before this scan runs -
# without these, every line in service/ and wordpress-plugin/wp-critical-css/
# reports as uncovered regardless of the real test suites both actually have.
sonar.javascript.lcov.reportPaths=service/lcov.info
sonar.php.coverage.reportPaths=wordpress-plugin/wp-critical-css-tests/coverage.xml

# php:S105 (tab indentation) can't be fixed in code here - WordPress Coding
# Standards mandate tabs for PHP, which is exactly what this rule flags, and
# every .php file under wordpress-plugin/ (both the shipped plugin and its
# test suite) uses them consistently for that reason. An inline `// NOSONAR
# php:S105` comment does NOT suppress this - confirmed directly against
# SonarCloud's own issue-search API: this rule reports with no anchor line
# (line: null) for every one of its findings in this project, and NOSONAR is
# a per-line suppression mechanism that has nothing to attach to when there's
# no line. This project ran under SonarCloud's Automatic Analysis mode before
# this file existed, which has no config surface for issue exclusions at all
# - CI-based analysis (this file, wired into .github/workflows/ci.yml) is the
# only way to actually exclude this rule for this codebase's PHP files.
#
# docker:S8431 flags FROM image:tag@digest as redundant ("use either the
# tag or the digest, not both") - here that's the opposite of redundant,
# it's the deliberate point: the digest is what actually pins the byte-
# identical base layers (see this Dockerfile's own comment on that FROM
# line; Chrome itself is pinned separately there), and the tag alongside it is purely for a human reading the file
# to see the rough version at a glance without decoding a hash. This
# pattern predates this properties file; it only started showing up as a
# "new code" issue once a version bump touched that exact line for the
# first time under CI-based analysis.
#
# php:S100 wants camelCase function names (^[a-z][a-zA-Z0-9]*$), while the
# WordPress Coding Standards this plugin is linted against (WordPress-Extra
# in wp-critical-css-tests/.phpcs.xml.dist, which includes its naming
# sniffs) mandate snake_case - and every function under wordpress-plugin/ is
# a wpcc_* snake_case one for that reason. Same WPCS-vs-Sonar-default clash
# as php:S105 above; unlike S105 this one does carry an anchor line, but it
# would repeat for every new function, so it's excluded for the rule rather
# than NOSONAR'd on the one function currently flagged (wpcc_send_webhook).
#
# javascript:S9382 ("Unexpected await inside a loop") flags places where
# this service awaits sequentially in a loop, and each one is deliberate:
# the single-worker queue renders one URL at a time so at most one Chrome
# instance ever runs (server.js header comment); the receiver retry loop
# waits out its backoff between attempts; the sitemap sweep paces its
# enqueue() calls with SWEEP_DELAY_MS; and safeFetch()'s hop loop in lib.js
# must validate one redirect hop before following the next (SSRF policy).
# Running any of these in parallel - what the rule suggests - would break
# the guarantee it exists for. This is excluded here instead of with an
# inline NOSONAR because server.js has no unit tests (SonarCloud reports it
# at 0% coverage), so every line touched in it, even just to append a
# comment, lands in "new code" uncovered and puts the new_coverage Quality
# Gate at risk. Scoped to the two files that hold these loops, not
# service/**, so a genuinely avoidable await-in-loop elsewhere (e.g. in a
# test) still gets reported.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S105
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e2.resourceKey=service/Dockerfile
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S100
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S9382
sonar.issue.ignore.multicriteria.e4.resourceKey=service/server.js
sonar.issue.ignore.multicriteria.e5.ruleKey=javascript:S9382
sonar.issue.ignore.multicriteria.e5.resourceKey=service/lib.js
