# Every entry carries a cooldown: a version published minutes ago is the one
# most likely to be a compromised release that gets pulled within days, so
# Dependabot waits before proposing it. Security updates ignore the cooldown,
# so a real fix is never delayed by it (zizmor: dependabot-cooldown).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/service"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # critical 9 is a rewrite, not an upgrade: no `generate` export, no
      # penthouse/Puppeteer (it launches its own Playwright Chromium with a
      # hard-coded --no-sandbox) and pages are fetched with a bare fetch(), so
      # neither the private/reserved-address policy nor the Chromium request
      # interception in service/ssrf-chromium.js has anywhere to attach. #91 failed the
      # Docker smoke test at the very first import. Moving to v9 needs its own
      # design (SSRF model included), not a Dependabot PR. Minor and patch
      # updates of 8.x and security updates are not affected by this rule;
      # lift it when that design exists.
      - dependency-name: "critical"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/service"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # init and analyze (codeql.yml) must run the same action version, or CodeQL
      # fails with "Loaded a configuration file for version X, but running version Y"
      # - Dependabot proposed them as three separate PRs (#73, #76, #77), none of which
      # could pass alone - so all github/codeql-action/* update as one PR.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  # Exception while semgrep still declares pyjwt~=2.13.0 (semgrep/semgrep#11925): requirements.txt
  # hand-pins pyjwt 2.15.0 for security fixes, and any regeneration reverts it to 2.13.0. Such a PR
  # fails the "Guard PyJWT security floor" step in semgrep.yml (a required check); re-apply the
  # pin on the PR branch (see the notes in semgrep.yml) before merging.
  - package-ecosystem: "pip"
    directory: "/.github/semgrep"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "composer"
    directory: "/wordpress-plugin/wp-critical-css-tests"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
