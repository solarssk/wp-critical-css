version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Exception while semgrep still declares pyjwt~=2.13.0 (semgrep/semgrep#11925): requirements.txt
  # hand-pins pyjwt 2.14.0 for security fixes, and any regeneration reverts it to 2.13.0. Such a PR
  # fails the "Guard PyJWT security floor" step in semgrep.yml (a required check); re-apply the
  # pin on the PR branch (see the notes in semgrep.yml) before merging.
  - package-ecosystem: "pip"
    directory: "/.github/semgrep"
    schedule:
      interval: "weekly"

  - package-ecosystem: "composer"
    directory: "/wordpress-plugin/wp-critical-css-tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
