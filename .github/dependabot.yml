# Every entry carries a cooldown: a version published minutes ago is the one
# most likely to be a compromised release that gets pulled within days, so
# Dependabot waits before proposing it. Security updates ignore the cooldown,
# so a real fix is never delayed by it (zizmor: dependabot-cooldown).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/service"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/service"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # init and analyze (codeql.yml) must run the same action version, or CodeQL
      # fails with "Loaded a configuration file for version X, but running version Y"
      # - Dependabot proposed them as three separate PRs (#73, #76, #77), none of which
      # could pass alone - so all github/codeql-action/* update as one PR.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  # Semgrep's MCP/OpenTelemetry ranges still exclude our patched versions.
  # Dependabot's pip resolver cannot apply overrides.txt: its weekly Semgrep
  # update fails with dependency_file_not_resolvable. Only that version update
  # is paused; security updates and updates of the remaining packages stay on.
  # Update Semgrep with scripts/update-semgrep.sh until upstream accepts the
  # patched ranges, then remove this ignore.
  - package-ecosystem: "pip"
    directory: "/.github/semgrep"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "semgrep"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"

  - package-ecosystem: "composer"
    directory: "/wordpress-plugin/wp-critical-css-tests"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
