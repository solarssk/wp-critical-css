name: Verify Semgrep lock
on:
  push:
    branches: [security/semgrep-lock-verification]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Regenerate and verify the scanner dependencies
        run: |
          printf '\nwcmatch==11.2\n' >> .github/semgrep/overrides.txt
          python -m venv /tmp/semgrep-lock
          source /tmp/semgrep-lock/bin/activate
          python -m pip install uv
          bash scripts/update-semgrep.sh
          python -m pip install --only-binary=:all: --require-hashes --no-deps -r .github/semgrep/requirements.txt
          semgrep scan --config=p/javascript --config=p/php --error . --exclude node_modules
          echo LOCKFILE_BEGIN
          cat .github/semgrep/requirements.txt
          echo LOCKFILE_END
