name: Publish plugin

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build the plugin zip from (branch, tag, or SHA). Only a ref matching a semver tag actually publishes to the GitHub Release - anything else just builds the zip as a workflow artifact.'
        required: false
        default: refs/heads/main

# Read-only by default: every job below declares the writes it needs itself, so a
# job added later inherits nothing more than `contents: read` (OpenSSF Scorecard
# Token-Permissions, which scores a top-level write as a finding).
permissions:
  contents: read

# Grouped per target, not per workflow: a GitHub concurrency group holds at
# most one running AND one pending run - it's not a FIFO queue, so a group
# shared by every ref (this workflow's previous approach) means a third
# overlapping run (e.g. two tag pushes close together plus a manual
# dispatch) silently replaces the pending run instead of queueing behind
# it, dropping a real release with no error anywhere. Grouping per target
# means a different tag never competes for that one pending slot in the
# first place - only two runs for the exact same target can still collide,
# which is the one case actually worth serializing.
#
# The ref is canonicalized before grouping: inputs.ref accepts both
# "v0.2.4" and "refs/tags/v0.2.4" as the same logical target (normalized
# later, in the "Resolve version" step) - grouping on the raw string would
# hash those two forms to different groups and defeat the point, so both
# are folded into the "refs/tags/..." form here too.
#
# cancel-in-progress: false so even a genuine same-target collision queues
# instead of cancelling a publish that already has side effects underway
# (GitHub Release, plugin zip asset).
concurrency:
  group: ${{ github.workflow }}-${{ contains(inputs.ref || github.ref, 'refs/tags/') && (inputs.ref || github.ref) || format('refs/tags/{0}', inputs.ref || github.ref) }}
  cancel-in-progress: false

jobs:
  build-zip:
    runs-on: ubuntu-latest
    # 10 min was the whole budget before signing (the job itself takes seconds). The fail-open signing steps can use
    # 14 more in the worst case (2+2+3+3+2+2), and a job-level timeout is NOT absorbed by continue-on-error, so this
    # limit has to cover both: 10 + 14, plus a minute of margin.
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write # OIDC token for keyless Sigstore signing (cosign)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Resolve version
        id: resolve
        env:
          # Passed through env:, never interpolated into the script below: inputs.ref is a
          # free-form workflow_dispatch string and github.ref on a tag push is a name the
          # pusher chose, and either would be parsed as shell code here, before the regex
          # below has validated anything (zizmor: template-injection).
          TARGET_REF: ${{ inputs.ref || github.ref }}
        run: |
          REF="$TARGET_REF"
          # Strips an optional "refs/tags/" prefix before matching - a real push event's github.ref is always the fully-qualified form, but workflow_dispatch's `ref` is a plain string field, not a ref picker, so an operator following this repo's own docs (which just say "supply an existing tag") could very plausibly type the bare tag (v0.2.1) instead - verified this is genuinely ambiguous by re-reading that wording, not assumed. Parameter expansion leaves REF untouched when the prefix isn't present, so this accepts both forms without a second branch.
          BARE_REF="${REF#refs/tags/}"
          if [[ "$BARE_REF" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}${BASH_REMATCH[4]}"
            {
              echo "publish=true"
              echo "version=$VERSION"
              echo "tag=v$VERSION"
            } >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      # Catches the exact mistake Codex caught in service/package.json for the 0.2.0 release (tagged without bumping the version field first) - here it's a hard failure instead of a follow-up fix, since nothing downstream re-derives the plugin's displayed version from the tag.
      # Two independent fields, two independent ways to forget one of them:
      # wp-critical-css.php's Version header (WordPress reads this for the
      # installed-plugin version, e.g. in wp-admin's Plugins list) and
      # readme.txt's Stable tag (WordPress.org-format field, unused since
      # this plugin isn't distributed there - but the official Plugin
      # Check tool still validates it against the header and fails the
      # build on a mismatch, exactly what happened preparing v0.2.2: the
      # header was bumped, readme.txt's Stable tag wasn't, caught only by
      # that CI job, not by anything release-blocking here).
      - name: Verify plugin header version matches the tag
        if: steps.resolve.outputs.publish == 'true'
        run: |
          HEADER_VERSION=$(grep -oP '^\s*\*\s*Version:\s*\K\S+' wordpress-plugin/wp-critical-css/wp-critical-css.php)
          if [ "$HEADER_VERSION" != "${{ steps.resolve.outputs.version }}" ]; then
            echo "::error::wp-critical-css.php's own Version header ($HEADER_VERSION) doesn't match the pushed tag (${{ steps.resolve.outputs.version }}) - bump the header before tagging."
            exit 1
          fi

      - name: Verify readme.txt's Stable tag matches the tag
        if: steps.resolve.outputs.publish == 'true'
        run: |
          STABLE_TAG=$(grep -oP '^Stable tag:\s*\K\S+' wordpress-plugin/wp-critical-css/readme.txt)
          if [ "$STABLE_TAG" != "${{ steps.resolve.outputs.version }}" ]; then
            echo "::error::readme.txt's Stable tag ($STABLE_TAG) doesn't match the pushed tag (${{ steps.resolve.outputs.version }}) - bump it before tagging (WordPress Plugin Check validates this against the Version header too)."
            exit 1
          fi

      # Curated release notes/title live in .github/release-notes/, one pair of files per tag, written by hand as part of preparing the release (see docs/DEPLOYMENT.md) - matches the convention this repo's own admitto project uses. Failing here instead of silently falling back to --generate-notes keeps every release's notes and title actually curated rather than GitHub's raw PR-title changelog.
      - name: Verify release artifacts
        if: steps.resolve.outputs.publish == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          TITLE_FILE=".github/release-notes/${TAG}.title"
          NOTES_FILE=".github/release-notes/${TAG}.md"
          for f in "$TITLE_FILE" "$NOTES_FILE"; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty - add it before tagging $TAG (see docs/DEPLOYMENT.md's Releases section)."
              exit 1
            fi
          done

      # WordPress' own "upload a zip" installer (and the wp-admin plugin list after activation) expects exactly one top-level directory matching the plugin slug, not the files loose at the zip root - wordpress-plugin/wp-critical-css/ already has that shape, so this just zips it as-is without restructuring anything.
      - name: Build plugin zip
        run: |
          cd wordpress-plugin
          zip -r "wp-critical-css-${{ steps.resolve.outputs.version }}.zip" wp-critical-css/ -x '*.DS_Store'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp-critical-css-plugin
          path: wordpress-plugin/wp-critical-css-*.zip
          retention-days: 90

      # Creates the GitHub Release if this is the first of this repo's workflows to finish for the tag, or just attaches the zip if publish-container.yml's own SBOM-upload step already created it. Title and notes come from the curated .github/release-notes/ files verified above, not --generate-notes's raw PR-title changelog - --latest is explicit because GitHub only auto-assigns the "Latest" badge to the newest non-prerelease release, and this repo doesn't mark 0.x.x tags as pre-release (each one is a real, deployed release, not an unstable preview).
      #
      # Tries create first and falls back to upload on failure, rather than checking `gh release view` beforehand - both this workflow and publish-container.yml run from the same tag push, so a genuine race is possible: both could see "no release yet" and both then call `gh release create`, and that command has no upsert option - the loser would otherwise exit here under `set -e` with its own asset never attached. Falling back to upload on any create failure (not just a pre-checked "already exists") handles that race without needing to tell the two workflows apart or add locking.
      - name: Create or update the GitHub Release with the plugin zip
        id: create-release
        if: steps.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          ZIP="wordpress-plugin/wp-critical-css-${{ steps.resolve.outputs.version }}.zip"
          NOTES_FILE=".github/release-notes/${TAG}.md"
          DISPLAY_TITLE="$(bash scripts/release-display-title.sh "${{ steps.resolve.outputs.version }}")"
          if gh release create "$TAG" --repo "${{ github.repository }}" --title "$DISPLAY_TITLE" --notes-file "$NOTES_FILE" --latest -- "$ZIP"; then
            echo "Created release $TAG ($DISPLAY_TITLE) with the plugin zip attached."
          else
            echo "release create failed - assuming a concurrent run (publish-container.yml, or a retry of this workflow) won the race and already created $TAG; retrying as an upload instead."
            gh release upload "$TAG" "$ZIP" --repo "${{ github.repository }}" --clobber
          fi

      # ---- Keyless Sigstore signature for the plugin zip ---------------------------------------
      # Runs AFTER the zip is already on the GitHub Release (step above): a Sigstore outage or a bug
      # in these steps can never stop the zip from being published. Every step is continue-on-error
      # with its own timeout-minutes (a job-level timeout is not caught by continue-on-error), so the
      # run stays green - release.yml waits on this run with `gh run watch --exit-status` and would
      # otherwise leave the milestone open and push the maintainer towards re-dispatching BOTH publish
      # workflows for what is only a missing signature. "Report signing status" makes any failure
      # loud (::warning:: + run summary). Signing also runs on publish=false dispatches so a dry run
      # exercises cosign + OIDC + Fulcio + Rekor for real; only attaching needs publish=true.
      - name: Drop a signature left by an earlier run of this tag
        id: drop
        if: steps.resolve.outputs.publish == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          SIG_NAME: wp-critical-css-${{ steps.resolve.outputs.version }}.zip.sigstore.json
        run: |
          set -euo pipefail
          # The zip is not byte-reproducible and the step above re-uploads it with --clobber on a
          # re-publish, so a signature from an earlier run would no longer verify against it.
          # Captured first, not piped into grep -q: under pipefail grep's early exit can SIGPIPE gh.
          EXISTING="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if grep -qxF "$SIG_NAME" <<<"$EXISTING"; then
            gh release delete-asset "$TAG" "$SIG_NAME" --repo "$GITHUB_REPOSITORY" --yes
          fi

      - name: Install cosign
        id: cosign
        continue-on-error: true
        timeout-minutes: 2
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign plugin zip (keyless) and self-verify
        id: sign
        if: steps.cosign.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        env:
          ZIP: wordpress-plugin/wp-critical-css-${{ steps.resolve.outputs.version }}.zip
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle "${ZIP}.sigstore.json" "$ZIP"
          # Same constraints DEPLOYMENT.md gives downloaders; identity = this run's own workflow ref.
          cosign verify-blob \
            --bundle "${ZIP}.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$ZIP"

      - name: Attach the signature to the GitHub Release
        id: attach
        if: steps.resolve.outputs.publish == 'true' && steps.sign.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          SIG: wordpress-plugin/wp-critical-css-${{ steps.resolve.outputs.version }}.zip.sigstore.json
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$SIG" --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.sign.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        with:
          name: wp-critical-css-plugin-signature
          path: wordpress-plugin/wp-critical-css-*.zip.sigstore.json
          if-no-files-found: warn
          retention-days: 90

      - name: Report signing status
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          PUBLISH: ${{ steps.resolve.outputs.publish }}
          TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_OUTCOME: ${{ steps.create-release.outcome }}
          DROP_OUTCOME: ${{ steps.drop.outcome }}
          COSIGN_OUTCOME: ${{ steps.cosign.outcome }}
          SIGN_OUTCOME: ${{ steps.sign.outcome }}
          ATTACH_OUTCOME: ${{ steps.attach.outcome }}
        run: |
          {
            echo "### Plugin zip signing"
            echo ""
            echo "| Step | Outcome |"
            echo "|---|---|"
            echo "| Publish the zip to the Release | ${RELEASE_OUTCOME} |"
            echo "| Drop a stale signature | ${DROP_OUTCOME} |"
            echo "| Install cosign | ${COSIGN_OUTCOME} |"
            echo "| Sign + self-verify zip | ${SIGN_OUTCOME} |"
            echo "| Attach to Release | ${ATTACH_OUTCOME} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISH" = true ]; then
            if [ "$RELEASE_OUTCOME" = success ] && [ "$ATTACH_OUTCOME" != success ]; then
              echo "::warning title=Plugin zip on the Release is UNSIGNED::${TAG}'s zip was published but its signature was not attached (drop=${DROP_OUTCOME}, cosign=${COSIGN_OUTCOME}, sign=${SIGN_OUTCOME}, attach=${ATTACH_OUTCOME}). Retry with: gh workflow run publish-plugin.yml --ref ${TAG} -f ref=${TAG} (the form release.yml uses, so the signature identity stays @refs/tags/${TAG}; a dispatch from main signs as @refs/heads/main, which the DEPLOYMENT.md verify command rejects)."
            fi
            if [ "$DROP_OUTCOME" = failure ] && [ "$ATTACH_OUTCOME" != success ]; then
              echo "::warning title=A stale signature may still be on the Release::Dropping the signature of an earlier run of ${TAG} failed and no new one was attached, so a wp-critical-css-*.zip.sigstore.json from that earlier run may still be there and will not verify against this zip. Check: gh release view ${TAG} --json assets --jq '.assets[].name'; delete the .sigstore.json asset if it is present."
            fi
          elif [ "$SIGN_OUTCOME" != success ]; then
            echo "::warning title=Signing dry run did not sign::cosign=${COSIGN_OUTCOME}, sign=${SIGN_OUTCOME}. Nothing was published or attached (publish=false)."
          fi
