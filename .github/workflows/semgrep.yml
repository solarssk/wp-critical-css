name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'

# Read-only by default: every job below declares the writes it needs itself, so a
# job added later inherits nothing more than `contents: read` (OpenSSF Scorecard
# Token-Permissions, which scores a top-level write as a finding).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  semgrep:
    name: Semgrep SAST (JS + PHP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Guard PyJWT security floor
        # .github/semgrep/requirements.txt hand-pins pyjwt above semgrep's own range (see the
        # Install Semgrep step below), and a routine pip-compile regeneration - for example a
        # Dependabot bump of semgrep - silently restores 2.13.0, which has open advisories.
        # Fail here with the fix spelled out. A floor rather than an exact match, so it stays
        # correct (and can simply be left in place) once semgrep allows a newer pyjwt.
        run: |
          version=$(sed -n 's/^pyjwt\[crypto\]==\([0-9.]*\).*/\1/p' .github/semgrep/requirements.txt)
          if [ -z "$version" ] || [ "$(printf '%s\n2.15.0\n' "$version" | sort -V | head -n1)" != "2.15.0" ]; then
            echo "::error file=.github/semgrep/requirements.txt::pyjwt is '${version:-missing}', expected >= 2.15.0. A pip-compile regeneration reverted the hand-pin: re-apply pyjwt[crypto]==2.15.0 with its hashes (see the Install Semgrep comment below), or update this floor once semgrep allows a newer pyjwt."
            exit 1
          fi

      - name: Install Semgrep
        # Fully hash-locked (.github/semgrep/requirements.txt, compiled via
        # pip-compile --generate-hashes from requirements.in) - --require-hashes
        # makes pip refuse to install anything, including a transitive
        # dependency, that doesn't match a pinned hash exactly, closing off
        # a compromised/substituted package on PyPI even if its version
        # number matches what's pinned. A pip Dependabot entry
        # (.github/dependabot.yml) watches this pair of files and proposes
        # bump PRs (recompiling hashes for the new versions) the same way
        # it already does for npm/docker/github-actions, so this doesn't
        # go stale indefinitely either.
        #
        # --no-deps: the closure above is already complete and hash-pinned, so pip has
        # nothing left to resolve. It is needed because pyjwt is hand-pinned to 2.15.0 in
        # that file (fixes the 2.13.0 advisories, including the critical GHSA-ffc3-869f-jxw9,
        # and GHSA-42vr-xj54-vc7v, which 2.14.0 still has)
        # while semgrep 1.178.0, the newest release, still declares
        # `pyjwt[crypto]~=2.13.0`, so a resolving install fails with ResolutionImpossible.
        # Semgrep only imports jwt in its `semgrep mcp` server
        # (semgrep/mcp/utilities/token_verifier.py); this job runs `semgrep scan`, which
        # never loads it. Upstream tracks the too-tight range in semgrep/semgrep#11925.
        # Once a semgrep release allows pyjwt>=2.15, regenerate the requirements with
        # pip-compile (which drops the hand-pin) and remove --no-deps.
        run: |
          pip install --break-system-packages --only-binary=:all: --require-hashes --no-deps -r .github/semgrep/requirements.txt

      # --error makes findings fail this step (the gate); the two steps
      # below still run via if: always() so the SARIF is uploaded even
      # when this step fails, and a placeholder is written if Semgrep
      # crashed before producing one at all.
      - name: Run Semgrep
        run: >
          semgrep scan --config=p/javascript --config=p/php --error
          --sarif --output=semgrep.sarif .
          --exclude node_modules

      - name: Ensure SARIF file exists
        if: always()
        run: test -f semgrep.sarif || echo '{"version":"2.1.0","runs":[]}' > semgrep.sarif

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: semgrep.sarif
