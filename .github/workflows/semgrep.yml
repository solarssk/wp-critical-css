name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep SAST (JS + PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install Semgrep
        # Versions tracked in .github/semgrep/requirements.txt, not inline
        # here - a pip Dependabot entry (.github/dependabot.yml) watches
        # that file and proposes bump PRs the same way it already does for
        # npm/docker/github-actions, so this scanner's own version (and any
        # CVE fix in it or setuptools) doesn't go stale indefinitely.
        run: |
          pip install --break-system-packages --only-binary=:all: -r .github/semgrep/requirements.txt

      # --error makes findings fail this step (the gate); the two steps
      # below still run via if: always() so the SARIF is uploaded even
      # when this step fails, and a placeholder is written if Semgrep
      # crashed before producing one at all.
      - name: Run Semgrep
        run: >
          semgrep scan --config=p/javascript --config=p/php --error
          --sarif --output=semgrep.sarif .
          --exclude node_modules

      - name: Ensure SARIF file exists
        if: always()
        run: test -f semgrep.sarif || echo '{"version":"2.1.0","runs":[]}' > semgrep.sarif

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: semgrep.sarif
