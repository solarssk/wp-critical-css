name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'

# Read-only by default: every job below declares the writes it needs itself, so a
# job added later inherits nothing more than `contents: read` (OpenSSF Scorecard
# Token-Permissions, which scores a top-level write as a finding).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  semgrep:
    name: Semgrep SAST (JS + PHP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Guard PyJWT security floor
        # Keep the security floor even though Semgrep now accepts this patched
        # line: regenerating the lock must never restore the vulnerable version.
        run: |
          version=$(sed -nE 's/^pyjwt(\[crypto\])?==([0-9.]+).*/\2/p' .github/semgrep/requirements.txt)
          if [ -z "$version" ] || [ "$(printf '%s\n2.15.0\n' "$version" | sort -V | head -n1)" != "2.15.0" ]; then
            echo "::error file=.github/semgrep/requirements.txt::pyjwt is '${version:-missing}', expected >= 2.15.0. Check requirements.in and regenerate with bash scripts/update-semgrep.sh."
            exit 1
          fi

      - name: Guard mcp security floor
        # overrides.txt raises MCP above Semgrep's pin (1.29.0, which has
        # GHSA-84m7-p3x7-pcfv). Do not lose that exception during regeneration.
        run: |
          version=$(sed -n 's/^mcp==\([0-9.]*\).*/\1/p' .github/semgrep/requirements.txt)
          if [ -z "$version" ] || [ "$(printf '%s\n1.30.0\n' "$version" | sort -V | head -n1)" != "1.30.0" ]; then
            echo "::error file=.github/semgrep/requirements.txt::mcp is '${version:-missing}', expected >= 1.30.0. Check overrides.txt and regenerate with bash scripts/update-semgrep.sh."
            exit 1
          fi

      - name: Guard OpenTelemetry security floor
        # Same reasoning as the guards above: overrides.txt pins the OpenTelemetry
        # family above semgrep's own range (`opentelemetry-api~=1.37.0`, which has
        # GHSA-xcq7-p3pf-p88h, patched in 1.45.1). A floor, so it can stay
        # once Semgrep catches up.
        run: |
          version=$(sed -n 's/^opentelemetry-api==\([0-9.]*\).*/\1/p' .github/semgrep/requirements.txt)
          if [ -z "$version" ] || [ "$(printf '%s\n1.45.1\n' "$version" | sort -V | head -n1)" != "1.45.1" ]; then
            echo "::error file=.github/semgrep/requirements.txt::opentelemetry-api is '${version:-missing}', expected >= 1.45.1. Check overrides.txt and regenerate with bash scripts/update-semgrep.sh."
            exit 1
          fi

      - name: Install Semgrep
        # Hash-locked for Linux/Python 3.11 by scripts/update-semgrep.sh.
        # --no-deps is still needed: overrides.txt deliberately raises MCP and
        # OpenTelemetry above Semgrep's declared ranges. The resolver applies
        # those exceptions when generating the complete closure, not at install
        # time. PyJWT no longer needs an override; Semgrep 1.180.0 accepts >=2.15.
        # Remove each exception only after upstream accepts its patched line.
        # Dependabot's Semgrep version updates alone are paused until then;
        # security updates and the other dependency updates remain enabled.
        run: |
          pip install --break-system-packages --only-binary=:all: --require-hashes --no-deps -r .github/semgrep/requirements.txt

      # --error makes findings fail this step (the gate); the two steps
      # below still run via if: always() so the SARIF is uploaded even
      # when this step fails, and a placeholder is written if Semgrep
      # crashed before producing one at all.
      - name: Run Semgrep
        run: >
          semgrep scan --config=p/javascript --config=p/php --error
          --sarif --output=semgrep.sarif .
          --exclude node_modules

      - name: Ensure SARIF file exists
        if: always()
        run: test -f semgrep.sarif || echo '{"version":"2.1.0","runs":[]}' > semgrep.sarif

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: semgrep.sarif
