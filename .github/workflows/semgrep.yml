name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep SAST (JS + PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'

      - name: Install Semgrep
        # Fully hash-locked (.github/semgrep/requirements.txt, compiled via
        # pip-compile --generate-hashes from requirements.in) - --require-hashes
        # makes pip refuse to install anything, including a transitive
        # dependency, that doesn't match a pinned hash exactly, closing off
        # a compromised/substituted package on PyPI even if its version
        # number matches what's pinned. A pip Dependabot entry
        # (.github/dependabot.yml) watches this pair of files and proposes
        # bump PRs (recompiling hashes for the new versions) the same way
        # it already does for npm/docker/github-actions, so this doesn't
        # go stale indefinitely either.
        run: |
          pip install --break-system-packages --only-binary=:all: --require-hashes -r .github/semgrep/requirements.txt

      # --error makes findings fail this step (the gate); the two steps
      # below still run via if: always() so the SARIF is uploaded even
      # when this step fails, and a placeholder is written if Semgrep
      # crashed before producing one at all.
      - name: Run Semgrep
        run: >
          semgrep scan --config=p/javascript --config=p/php --error
          --sarif --output=semgrep.sarif .
          --exclude node_modules

      - name: Ensure SARIF file exists
        if: always()
        run: test -f semgrep.sarif || echo '{"version":"2.1.0","runs":[]}' > semgrep.sarif

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: semgrep.sarif
