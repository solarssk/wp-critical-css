name: Publish container

on:
  push:
    tags:
      - 'v*.*.*'
  schedule:
    # Weekly re-scan of the actual published image (ghcr.io/...:latest - what users actually pulled), offset from codeql.yml's (0 3) and semgrep.yml's (0 5) own schedules. Without this, a CVE disclosed in the pinned base image or its OS packages weeks after the last release tag stays invisible to this pipeline until someone manually dispatches it or cuts a new release - this is the only workflow that scans the actual container image. Deliberately NOT a rebuild from source on this trigger (see the "Build or pull image for scanning" step below) - a fresh `docker build` re-runs the Dockerfile's own `apt-get update && apt-get install --only-upgrade`, which would pull in today's patched OS packages regardless of what's actually baked into the image currently deployed, silently defeating the entire point of this weekly check.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build (branch, tag, or SHA). Only a ref matching a semver tag is actually published to ghcr.io - anything else runs the scan and stops there.'
        required: false
        default: refs/heads/main

permissions:
  contents: write
  packages: write
  security-events: write
  id-token: write
  attestations: write

# Grouped by workflow name alone, not by ref: this workflow has side
# effects (GHCR push, attestation, GitHub Release, SBOM) that must never be
# cancelled mid-run, and a per-ref group can't be made reliable anyway -
# inputs.ref accepts both "v0.2.4" and "refs/tags/v0.2.4" as the same
# logical target (normalized later, in the "Resolve publish target" step),
# so they'd hash to two different groups if the group key included the ref.
# cancel-in-progress: false means concurrent runs queue instead of racing
# or clobbering each other's publish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Resolve publish target
        id: resolve
        run: |
          REF="${{ inputs.ref || github.ref }}"
          # Strips an optional "refs/tags/" prefix before matching - a real push event's github.ref is always the fully-qualified form, but workflow_dispatch's `ref` is a plain string field, not a ref picker, so an operator following this repo's own docs (which just say "supply an existing tag") could very plausibly type the bare tag (v0.2.1) instead - verified this is genuinely ambiguous by re-reading that wording, not assumed. Parameter expansion leaves REF untouched when the prefix isn't present, so this accepts both forms without a second branch.
          BARE_REF="${REF#refs/tags/}"
          if [[ "$BARE_REF" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            # version/major_minor computed explicitly here, from the resolved ref (which correctly reflects a manual workflow_dispatch ref override), unlike docker/metadata-action's own {{version}} pattern - that reads github.ref_name directly, which on a workflow_dispatch run is the dispatch branch (e.g. main), not the tag passed via the `ref` input. Without this, a manual re-publish of an existing tag would push :latest and a :sha tag but silently skip the version tags entirely.
            {
              echo "publish=true"
              echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}${BASH_REMATCH[4]}"
              echo "major_minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              echo "tag=v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}${BASH_REMATCH[4]}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Curated release notes/title live in .github/release-notes/, one pair of files per tag, written by hand as part of preparing the release (see docs/DEPLOYMENT.md) - matches the convention this repo's own admitto project uses. Failing here instead of silently falling back to --generate-notes keeps every release's notes and title actually curated rather than GitHub's raw PR-title changelog. Runs before the build/scan work below so a missing file fails fast.
      - name: Verify release artifacts
        if: steps.resolve.outputs.publish == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          TITLE_FILE=".github/release-notes/${TAG}.title"
          NOTES_FILE=".github/release-notes/${TAG}.md"
          for f in "$TITLE_FILE" "$NOTES_FILE"; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty - add it before tagging $TAG (see docs/DEPLOYMENT.md's Releases section)."
              exit 1
            fi
          done

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        if: steps.resolve.outputs.publish == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.resolve.outputs.version }}
            type=raw,value=${{ steps.resolve.outputs.major_minor }}
            type=sha,format=short,prefix=

      # Build once, locally, and scan THAT image before it ever reaches the registry - the image is only pushed a second time, further down, if the CRITICAL-severity gate below passes. On a plain branch/SHA dispatch (publish=false) this is the only build that happens.
      #
      # NOT on a schedule trigger, deliberately: that run's whole purpose is to catch drift in what's already deployed, so it pulls and re-tags the actual published `:latest` image instead of building a fresh one from source - see the `schedule:` trigger's own comment above for why a rebuild here would silently defeat that.
      - name: Build image for scanning
        if: github.event_name != 'schedule'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./service
          file: ./service/Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}:ci-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull published image for scanning (weekly re-scan)
        if: github.event_name == 'schedule'
        run: |
          docker pull ghcr.io/${{ github.repository }}:latest
          docker tag ghcr.io/${{ github.repository }}:latest ghcr.io/${{ github.repository }}:ci-scan

      - name: Trivy scan (SARIF, always uploaded)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:ci-scan
          format: sarif
          output: trivy-results.sarif
          # MEDIUM included here (unlike the CRITICAL-only gate further down) so it's at least visible on the Security tab, not just excluded from failing the build - previously CRITICAL,HIGH only, which meant a MEDIUM finding never appeared anywhere in this repo's CI at all, not even informationally.
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        if: steps.resolve.outputs.publish == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:ci-scan
          format: cyclonedx
          output: sbom.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.resolve.outputs.publish == 'true'
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

      # Hard gate: fails the job (before any push) on fixable CRITICAL findings. ignore-unfixed avoids permanently red builds from unpatched base-image CVEs with no fix available yet.
      - name: Trivy gate (fixable CRITICAL only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:ci-scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image
        id: push
        if: steps.resolve.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./service
          file: ./service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        if: steps.resolve.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Creates the GitHub Release if this is the first of this repo's workflows to finish for the tag, or just attaches the SBOM if publish-plugin.yml's own zip-upload step already created it. Title and notes come from the curated .github/release-notes/ files verified above, not --generate-notes's raw PR-title changelog - --latest is explicit because GitHub only auto-assigns the "Latest" badge to the newest non-prerelease release, and this repo doesn't mark 0.x.x tags as pre-release (each one is a real, deployed release, not an unstable preview).
      #
      # Tries create first and falls back to upload on failure, rather than checking `gh release view` beforehand - both this workflow and publish-plugin.yml run from the same tag push, so a genuine race is possible: both could see "no release yet" and both then call `gh release create`, and that command has no upsert option - the loser would otherwise exit here under `set -e` with its own asset never attached. Falling back to upload on any create failure (not just a pre-checked "already exists") handles that race without needing to tell the two workflows apart or add locking.
      - name: Create or update the GitHub Release with the SBOM
        if: steps.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          NOTES_FILE=".github/release-notes/${TAG}.md"
          DISPLAY_TITLE="$(bash scripts/release-display-title.sh "${{ steps.resolve.outputs.version }}")"
          if gh release create "$TAG" --repo "${{ github.repository }}" --title "$DISPLAY_TITLE" --notes-file "$NOTES_FILE" --latest -- sbom.cdx.json; then
            echo "Created release $TAG ($DISPLAY_TITLE) with the SBOM attached."
          else
            echo "release create failed - assuming a concurrent run (publish-plugin.yml, or a retry of this workflow) won the race and already created $TAG; retrying as an upload instead."
            gh release upload "$TAG" sbom.cdx.json --repo "${{ github.repository }}" --clobber
          fi
