name: Publish container

on:
  push:
    tags:
      - 'v*.*.*'
  schedule:
    # Weekly re-scan of the actual published image (ghcr.io/...:latest -
    # what users actually pulled), offset from codeql.yml's (0 3) and
    # semgrep.yml's (0 5) own schedules. Without this, a CVE disclosed in
    # the pinned base image or its OS packages weeks after the last
    # release tag stays invisible to this pipeline until someone manually
    # dispatches it or cuts a new release - this is the only workflow that
    # scans the actual container image. Deliberately NOT a rebuild from
    # source on this trigger (see the "Build or pull image for scanning"
    # step below) - a fresh `docker build` re-runs the Dockerfile's own
    # `apt-get update && apt-get install --only-upgrade`, which would pull
    # in today's patched OS packages regardless of what's actually baked
    # into the image currently deployed, silently defeating the entire
    # point of this weekly check.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build (branch, tag, or SHA). Only a ref matching a semver tag is actually published to ghcr.io - anything else runs the scan and stops there.'
        required: false
        default: refs/heads/main

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Resolve publish target
        id: resolve
        run: |
          REF="${{ inputs.ref || github.ref }}"
          if [[ "$REF" =~ ^refs/tags/v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            # version/major_minor computed explicitly here, from the
            # resolved ref (which correctly reflects a manual
            # workflow_dispatch ref override), unlike
            # docker/metadata-action's own {{version}} pattern - that
            # reads github.ref_name directly, which on a workflow_dispatch
            # run is the dispatch branch (e.g. main), not the tag passed
            # via the `ref` input. Without this, a manual re-publish of an
            # existing tag would push :latest and a :sha tag but silently
            # skip the version tags entirely.
            {
              echo "publish=true"
              echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}${BASH_REMATCH[4]}"
              echo "major_minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        if: steps.resolve.outputs.publish == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.resolve.outputs.version }}
            type=raw,value=${{ steps.resolve.outputs.major_minor }}
            type=sha,format=short,prefix=

      # Build once, locally, and scan THAT image before it ever reaches the
      # registry - the image is only pushed a second time, further down,
      # if the CRITICAL-severity gate below passes. On a plain branch/SHA
      # dispatch (publish=false) this is the only build that happens.
      #
      # NOT on a schedule trigger, deliberately: that run's whole purpose
      # is to catch drift in what's already deployed, so it pulls and
      # re-tags the actual published `:latest` image instead of building a
      # fresh one from source - see the `schedule:` trigger's own comment
      # above for why a rebuild here would silently defeat that.
      - name: Build image for scanning
        if: github.event_name != 'schedule'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./service
          file: ./service/Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}:ci-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull published image for scanning (weekly re-scan)
        if: github.event_name == 'schedule'
        run: |
          docker pull ghcr.io/${{ github.repository }}:latest
          docker tag ghcr.io/${{ github.repository }}:latest ghcr.io/${{ github.repository }}:ci-scan

      - name: Trivy scan (SARIF, always uploaded)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:ci-scan
          format: sarif
          output: trivy-results.sarif
          # MEDIUM included here (unlike the CRITICAL-only gate further
          # down) so it's at least visible on the Security tab, not just
          # excluded from failing the build - previously CRITICAL,HIGH
          # only, which meant a MEDIUM finding never appeared anywhere in
          # this repo's CI at all, not even informationally.
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        if: steps.resolve.outputs.publish == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:ci-scan
          format: cyclonedx
          output: sbom.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.resolve.outputs.publish == 'true'
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

      # Hard gate: fails the job (before any push) on fixable CRITICAL
      # findings. ignore-unfixed avoids permanently red builds from
      # unpatched base-image CVEs with no fix available yet.
      - name: Trivy gate (fixable CRITICAL only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:ci-scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image
        id: push
        if: steps.resolve.outputs.publish == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./service
          file: ./service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        if: steps.resolve.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
