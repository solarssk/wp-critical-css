name: Verify standard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    uses: solarssk/playbook/.github/workflows/verify-tier.yml@350fe17be7b29e2855967e8273726f13bbfc20f2  # v0.3.0
