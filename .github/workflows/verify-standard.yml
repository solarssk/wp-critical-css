name: Verify standard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    uses: solarssk/playbook/.github/workflows/verify-tier.yml@05abd97b57a86b1279885da39247e0b9ddb49107  # v0.1.1
