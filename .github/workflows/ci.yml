name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & audit (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: service/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Syntax-check server.js
        run: node --check server.js

  php-lint:
    name: PHP syntax check (mu-plugins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Lint every mu-plugin file
        run: |
          set -euo pipefail
          for f in wordpress-mu-plugins/*.php; do
            echo "::group::php -l $f"
            php -l "$f"
            echo "::endgroup::"
          done

  docker-build:
    name: Docker build smoke test
    needs: [build-test, php-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image (no push, load for the smoke test below)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./service
          file: ./service/Dockerfile
          push: false
          load: true
          tags: wp-critical-css:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build that succeeds doesn't prove the image works - Puppeteer
      # needs more than "Chrome is present somewhere in the filesystem"
      # (its postinstall step registers the exact cache path its own
      # runtime later reads from), so this actually launches Chrome and
      # renders a real page, not just checks the HTTP server answers.
      - name: Smoke test - real Puppeteer render
        run: |
          docker run --rm wp-critical-css:ci node --input-type=module -e "
          import { generate } from 'critical';
          const { css } = await generate({ src: 'https://example.com', inline: false, dimensions: [{ width: 412, height: 915 }], penthouse: { timeout: 30000 } });
          if (!css || css.toString().length === 0) { throw new Error('generated empty CSS'); }
          console.log('Puppeteer render OK,', css.toString().length, 'bytes of CSS');
          "

      - name: Smoke test - HTTP server responds
        run: |
          docker run -d --rm --name wpcc-smoke -p 3939:3939 -e SHARED_SECRET=ci-smoke-test -e WP_RECEIVER_URL=http://example.invalid/ -e ALLOWED_HOSTNAME=example.com wp-critical-css:ci # NOSONAR githubactions:S5332 - example.invalid is an RFC 2606 reserved non-resolving placeholder, and this smoke test never actually calls it
          for i in $(seq 1 10); do
            echo "health check attempt $i"
            if curl -sf http://localhost:3939/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:3939/health | grep -q '"status":"ok"'
          docker stop wpcc-smoke
