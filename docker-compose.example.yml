# Example service block to add to your existing WordPress docker-compose.yml.
# Adjust the network name to match your stack, and either build from this
# repo directly (as shown) or build/push an image and reference it with
# `image:` instead.

services:
  critical-css-service:
    build:
      context: https://github.com/<your-username>/wp-critical-css.git
      dockerfile: service/Dockerfile
    container_name: critical-css-service
    restart: always
    cap_add:
      - SYS_ADMIN # required by the official Puppeteer base image for Chrome's sandbox
    networks:
      - your_wordpress_network
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3939/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 1g

networks:
  your_wordpress_network:
    external: true
